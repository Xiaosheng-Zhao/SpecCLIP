seed_everything: 42
trainer:
  default_root_dir: "/mnt/tianwen-course/tianwen/home/zxs/tianqin/astroclip/outputs"
  enable_checkpointing: true
  gradient_clip_val: 1.
  max_steps: 1960000 #122500
  precision: 32
  limit_val_batches: 100
  accelerator: 'gpu' #new
  devices: 4 #new
  strategy: 'ddp'
  num_nodes: 1
  log_every_n_steps: 1000
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: "step"
    - class_path: ModelCheckpoint
      init_args:
        save_last: True
        save_top_k: 2
        monitor: "val_epoch_loss"
        mode: "min"
        filename: "{epoch}-{val_loss:.4f}"
    # Add this new callback for saving at specific epoch
    - class_path: ModelCheckpoint
      init_args:
        save_top_k: 1
        monitor: "epoch"
        mode: "max"
        filename: "epoch-128-test-{val_loss:.4f}"
        every_n_epochs: 2
        save_on_train_epoch_end: True
    - class_path: CustomEarlyStopping
      init_args:
        monitor: "val_epoch_loss"
        min_delta: 1e-5
        patience: 10
        verbose: False
        mode: "min"
        check_finite: True
    - class_path: EpochLossCallback
      init_args:
        log_train_path: "/mnt/tianwen-course/tianwen/home/zxs/training_loss_mlp_ae4_nodrop_128.txt"
        log_val_path: "/mnt/tianwen-course/tianwen/home/zxs/validation_loss_mlp_ae4_nodrop_128.txt"
  
  logger:
    class_path: CustomWandbLogger
    init_args:
      project: "astroclip-spectrum"
      entity: "{WANDB_ENTITY_NAME}"
      save_dir: ${trainer.default_root_dir}
      
model:
  class_path: SpectralMLPAutoencoder
  init_args:
    input_dim: 1
    seq_len: 1462
    hidden_dim: 1245  # Adjusted to reach ~42.7M params
    bottleneck_dim: 768
    num_encoder_blocks: 2
    num_decoder_blocks: 2
    expansion_factor: 3
    use_masking: false
    mask_ratio: 0.15
    mask_chunk_width: 20
    dropout: 0.0
    mask_num_chunks: 6
    
data:
  class_path: SpectrumDataloader
  init_args:
    path: "/mnt/tianwen-course/tianwen/home/zxs/tianqin/astroclip/datasets/splitted_crossed_100w_gaspp_norm.h5"
    batch_size: 64
    num_workers: 32
    
optimizer:
  class_path: torch.optim.adamw.AdamW
  init_args:
    lr: 1e-5
    weight_decay: 1e-1
    betas:
      - 0.9
      - 0.95
      
lr_scheduler:
  class_path: CosineAnnealingWithWarmupLR
  init_args:
    T_max: ${trainer.max_steps}
    T_warmup: 19520
    eta_min: ${eval:'${optimizer.init_args.lr}//100'}