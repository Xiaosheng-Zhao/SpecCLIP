seed_everything: 42
trainer:
  default_root_dir: "/home/idies/workspace/Storage/xzhao/DESI-workspace/xzhao/SpecCLIP/outputs"
  enable_checkpointing: true
  gradient_clip_val: 1.
  max_steps: 1960000 #980000 8 #122500 64 #1960000 4
  precision: 32
  limit_val_batches: 100
  accelerator: 'gpu' #new
  devices: 2 #new
  strategy: 'ddp'
  num_nodes: 1
  log_every_n_steps: 1000
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: "step"
    - class_path: ModelCheckpoint
      init_args:
        save_last: True
        save_top_k: 2
        monitor: "val_epoch_loss"
        mode: "min"
        filename: "{epoch}-{val_loss:.4f}"
    # Add this new callback for saving at specific epoch
    - class_path: ModelCheckpoint
      init_args:
        save_top_k: 1
        monitor: "epoch"
        mode: "max"
        filename: "epoch-128-test-{val_loss:.4f}"
        every_n_epochs: 191
        save_on_train_epoch_end: True
    - class_path: CustomEarlyStopping
      init_args:
        monitor: "val_epoch_loss"
        min_delta: 1e-4
        patience: 10
        verbose: False
        mode: "min"
        check_finite: True
    - class_path: EpochLossCallback
      init_args:
        log_train_path: "/home/idies/workspace/Storage/xzhao/DESI-workspace/xzhao/SpecCLIP/training_loss_xp_1_stats_ae4_oldflux_nodrop_191.txt"
        log_val_path: "/home/idies/workspace/Storage/xzhao/DESI-workspace/xzhao/SpecCLIP/validation_loss_xp_1_stats_ae4_oldflux_nodrop_191.txt"
  
  logger:
    class_path: CustomWandbLogger
    init_args:
      project: "astroclip-spectrum"
      entity: "{WANDB_ENTITY_NAME}"
      save_dir: ${trainer.default_root_dir}
      
model:
  class_path: SpectralMLPAutoencoder_xp
  init_args:
    input_dim: 1
    seq_len: 343
    hidden_dim: 1290  # Adjusted to reach ~42.7M params
    bottleneck_dim: 768
    num_encoder_blocks: 2
    num_decoder_blocks: 2
    expansion_factor: 3
    use_masking: false
    mask_ratio: 0.15
    mask_chunk_width: 20
    dropout: 0.0
    mask_num_chunks: 6
    
data:
  class_path: SpectrumDataloader
  init_args:
    path: "/home/idies/workspace/Storage/xzhao/DESI-workspace/shared/gaia_spectra_subsample_100.h5"
    batch_size: 32
    num_workers: 4
    
optimizer:
  class_path: torch.optim.adamw.AdamW
  init_args:
    lr: 1e-5
    weight_decay: 1e-1
    betas:
      - 0.9
      - 0.95
      
lr_scheduler:
  class_path: CosineAnnealingWithWarmupLR
  init_args:
    T_max: ${trainer.max_steps}
    T_warmup: 19520 #9760 8 #19520 4 
    eta_min: ${eval:'${optimizer.init_args.lr}//100'}