seed_everything: 42
trainer:
  default_root_dir: "/mnt/tianwen-course/tianwen/home/zxs/tianqin/astroclip/outputs"
  enable_checkpointing: true
  gradient_clip_val: 1.
  max_epochs: 750 #10
  #max_steps: 122500 #500000 #5000 #500_000
  precision: 32 #null
  #limit_val_batches: 100
  accelerator: 'gpu' #new
  devices: 8 #new
  strategy: 'ddp'
  num_nodes: 1
  logger:
    class_path: CustomWandbLogger
    init_args:
      project: "astroclip-spectrum"
      entity: "{WANDB_ENTITY_NAME}"
      save_dir: ${trainer.default_root_dir}
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: "step"
    - class_path: ModelCheckpoint
      init_args:
        save_last: True #link
        save_top_k: 1
        monitor: "val_epoch_loss"
        mode: "min"
        filename: "{epoch}-{val_loss:.4f}"
    - class_path: SpecificEpochSaver
      init_args:
        epochs_to_save: [110]
        filename: "specific-epoch-{epoch:03d}-val_loss={val_loss:.4f}.ckpt"
        dirpath: /mnt/tianwen-course/tianwen/home/zxs/tianqin/astroclip/outputs/aeclip_checkpoints_lrs_epoch_split512256_mt_recordloss_equalw/
    - class_path: CustomEarlyStopping
      init_args:
        monitor: "val_epoch_loss"
        min_delta: 1e-4
        patience: 20
        verbose: False
        mode: "min"
        check_finite: True
    - class_path: EpochLossCallback
      init_args:
        log_train_path: "/mnt/tianwen-course/tianwen/home/zxs/training_loss_clip_100w_recon_1node_correct_private_5122562_recordloss.txt"
        log_val_path: "/mnt/tianwen-course/tianwen/home/zxs/validation_loss_clip_100w_recon_1node_correct_private_5122562_recordloss.txt"
model:
  class_path: SpecClipModel_reconstruct_split_5122562_recordloss
  init_args:

    gaia_xp_encoder:
      class_path: specclip.models.specclip_reconstruct_split_5122562_recordloss.GaiaXPHead_split
      init_args:
        model_path: "/mnt/tianwen-course/tianwen/home/zxs/tianqin/astroclip/outputs/astroclip-spectrum/j2nw9nh4/epoch=191-val_loss=0.0000.ckpt"

    lamost_lrs_encoder:
      class_path: specclip.models.specclip_reconstruct_split_5122562_recordloss.LamostLRSHead_split
      init_args:
        model_path: "/mnt/tianwen-course/tianwen/home/zxs/tianqin/astroclip/outputs/astroclip-spectrum/odhfepe1/checkpoints/epoch=128-val_loss=0.0000.ckpt"
    reconstruction_weight: 1.0
    cross_modal_weight: 1.0
data:
  class_path: SpecClipDataloader
  init_args:
    path: "/mnt/tianwen-tianqing-nas/tianwen/home/zxs/clip/gaia_lamost_split.h5"
    batch_size: 1024
    num_workers: 32
optimizer:
  class_path: torch.optim.adamw.AdamW
  init_args:
    lr: 1e-4 #1e-5
    weight_decay: 0.05 #1e-1
lr_scheduler:
  class_path: CosineAnnealingWithWarmupLR
  init_args:
    T_max: 10000
    T_warmup: 1000 # 2000 #200 #2000
    eta_min: ${eval:'${optimizer.init_args.lr}//100'}
